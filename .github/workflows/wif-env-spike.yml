name: WIF environment spike

on:
  push:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash spike/linux.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: ./spike/windows.ps1
        shell: pwsh

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash spike/macos.sh
